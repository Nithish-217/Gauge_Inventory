<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMTI | Login</title>
    <meta name="description" content="CMTI Login" />
    <style>
      :root {
        --bg: #0f172a; /* slate-900 */
        --card: #111827; /* gray-900 */
        --muted: #94a3b8; /* slate-400 */
        --text: #e5e7eb; /* gray-200 */
        --primary: #2563eb; /* blue-600 */
        --primary-hover: #1d4ed8; /* blue-700 */
        --ring: rgba(37, 99, 235, 0.35);
        --error: #ef4444;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg) 60%);
        color: var(--text);
      }
      .container {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        backdrop-filter: saturate(120%) blur(8px);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }
      .brand-logo {
        width: 120px; height: 120px;
        border-radius: 0;
        background: transparent;
        background-image: url('/download.png');
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        box-shadow: none;
      }
      h1 {
        font-size: 28px;
        line-height: 1.25;
        margin: 0;
        letter-spacing: 0.5px;
        font-weight: 700;
        color: var(--primary);
      }
      .subtle { color: var(--muted); font-size: 14px; margin-bottom: 32px; text-align: center; }

      .field { margin-bottom: 14px; }
      .label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .input {
        width: 100%;
        padding: 12px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(2,6,23,0.5);
        color: var(--text);
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .input::placeholder { color: #64748b; }
      .input:focus {
        border-color: var(--primary);
        box-shadow: none;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        min-width: 140px;
        height: 44px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        background: linear-gradient(180deg, var(--primary), var(--primary-hover));
        color: white;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.2px;
        cursor: pointer;
        transition: transform 0.03s ease, filter 0.2s ease;
      }
      .btn:hover { filter: brightness(1.05); }
      .btn:active { transform: translateY(1px); }

      .link {
        color: #93c5fd;
        text-decoration: none;
        font-size: 14px;
      }
      .link:hover { text-decoration: underline; }

      .error { color: var(--error); font-size: 13px; min-height: 18px; }
      .footer { margin-top: 18px; color: var(--muted); font-size: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true"></div>
          <h1>CMTI</h1>
        </div>
        <div id="root"></div>
        <p class="footer">© <span id="year"></span> CMTI. All rights reserved.</p>
      </div>
    </div>

    <!-- React 18 via CDN + Babel for JSX -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState } = React;

      function LoginCard() {
        const [username, setUsername] = useState("");
        const [password, setPassword] = useState("");
        const [error, setError] = useState("");
        const [message, setMessage] = useState("");
        const [loading, setLoading] = useState(false);

        async function handleSubmit(e) {
          e.preventDefault();
          setError("");
          setMessage("");
          if (!username.trim() || !password) {
            setError("Please enter both username and password.");
            return;
          }

          try {
            setLoading(true);
            const res = await fetch("http://localhost:5657/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });
            if (!res.ok) {
              const txt = await res.text();
              throw new Error(txt || "Login failed");
            }
            const data = await res.json();
            if (data && data.success) {
              setMessage("Login successful. Welcome, " + (data.user?.username || "user") + "!");
            } else {
              throw new Error(data?.message || "Invalid credentials");
            }
          } catch (err) {
            setError(typeof err?.message === "string" ? err.message : "Login failed");
          } finally {
            setLoading(false);
          }
        }

        function handleForgot(e) {
          e.preventDefault();
          alert("Forgot password flow coming soon.");
        }

        return (
          <form onSubmit={handleSubmit} noValidate style={{ textAlign: 'center' }}>
            <p className="subtle">Sign in to continue</p>

            <div className="field" style={{ textAlign: 'left' }}>
              <label htmlFor="username" className="label">* Username</label>
              <input
                id="username"
                type="text"
                className="input"
                placeholder="Enter your username"
                autoComplete="username"
                value={username}
                onChange={(e) => setUsername(e.target.value)}
                style={{ textAlign: 'left' }}
              />
            </div>

            <div className="field" style={{ textAlign: 'left' }}>
              <label htmlFor="password" className="label">* Password</label>
              <input
                id="password"
                type="password"
                className="input"
                placeholder="Enter your password"
                autoComplete="current-password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                style={{ textAlign: 'left' }}
              />
            </div>

            <div className="error" role="alert" aria-live="polite">{error}</div>
            {message && <div style={{color:'#86efac',fontSize:'13px',minHeight:'18px'}}>{message}</div>}

            <div className="actions">
              <button type="submit" className="btn" disabled={loading}>{loading ? "Logging in..." : "Login"}</button>
            </div>
          </form>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<LoginCard />);

      // Footer year
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
